<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>One Margarita</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: #1f201d;
        background: #f7f7f3;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding: 1rem;
        display: grid;
        place-items: center;
      }

      main {
        width: min(100%, 32rem);
        padding: clamp(1.25rem, 5vw, 2.5rem);
        border: 1px solid #d8d8d1;
        border-radius: 1rem;
        background: #fff;
      }

      h1 {
        margin: 0 0 1.5rem;
        font-size: clamp(2rem, 7vw, 3rem);
        line-height: 1.15;
        letter-spacing: -0.04em;
      }

      audio {
        display: block;
        width: 100%;
        min-width: 0;
        height: 54px;
      }

      audio:focus-visible {
        outline: 2px solid #285744;
        outline-offset: 5px;
        border-radius: 2rem;
      }

      a { color: #285744; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="song-title">One Margarita</h1>
      <audio controls preload="auto" aria-labelledby="song-title">
        <source src="one-margarita.mp3" type="audio/mpeg">
        <a href="one-margarita.mp3">Download MP3</a>
      </audio>
    </main>
  </body>
</html>
