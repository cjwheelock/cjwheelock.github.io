name = "cjwheelock-gtm-portfolio-api"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://cjwheelock.com,https://www.cjwheelock.com"

[[kv_namespaces]]
binding = "PORTFOLIO_DATA"
# Replace with the namespace ID created for this portfolio before deployment.
id = "00000000000000000000000000000000"

[[durable_objects.bindings]]
name = "ACCESS"
class_name = "CompanyAccess"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CompanyAccess"]
